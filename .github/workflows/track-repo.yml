# The repo track's reusable workflow.
#
# A per-track unit is a REUSABLE WORKFLOW and it contributes a JOB, not a step.
# GitHub resolves a local reusable workflow only as `./.github/workflows/<file>`,
# and nothing outside a callee workflow can insert a step into it. Each track
# therefore declares exactly one job in its own file and adds its steps inside
# that job.
#
# Each artifact-boundary lint step below closes a different hole and none
# substitutes for another: a step that reads committed files cannot see a byte
# that leaves the runner only as a build artifact.

name: track-repo

on:
  workflow_call:
    inputs:
      visibility:
        description: >-
          The calling repository's visibility, `public` or `private`. One clause
          of the credential lint is scoped to public repositories: a `secrets.`
          reference outside the three organization momus secrets is a defect in
          a public repository, while inside the private one the T1 and T2 jobs
          legitimately hold what they need. The other three steps apply to all
          seven repositories without exception.
        required: false
        type: string
        default: public

permissions:
  contents: read

jobs:
  repo-lints:
    name: repo-lints
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository under test
        uses: actions/checkout@v4
        with:
          path: under-test

      # The lint scripts live in the tools repository, which is PUBLIC.
      # Reading it needs no credential of any kind.
      #
      # `lint-current` IS A MOVING ALIAS IN nmg2-tools, AND THE PIN IS TEMPORARY
      # BY CONSTRUCTION. The lint code and the register data file this job reads
      # live on an unmerged PR stack there. A foreign-repository checkout with
      # no `ref:` takes that repository's DEFAULT branch, which carries older
      # copies, so an unpinned job lints against stale rules and says nothing
      # about it. `lint-current` names the stack branch that is current. One
      # push in nmg2-tools moves every consuming repository forward, so no
      # consumer is edited when the stack grows.
      #
      # DELETE THE `ref:` LINE when the stack merges into that default branch.
      # Until then two failure modes exist, and BOTH ARE LOUD ON PURPOSE: a
      # deleted alias makes this step error, and an alias that falls behind the
      # stack makes the next step fail. Do not add a fallback ref, `|| true`, or
      # `continue-on-error`. The silence those produce is the exact defect the
      # pin exists to remove.
      #
      # `fetch-depth: 0` is required by the staleness step below, which needs
      # merge bases.
      - name: Check out the lint scripts
        uses: actions/checkout@v4
        with:
          repository: axiomantic/nmg2-tools
          ref: lint-current
          fetch-depth: 0
          path: lint-tools

      # A PIN THAT MERELY FALLS BEHIND FAILS SILENTLY. Only a DELETED alias is
      # loud on its own. If the alias simply stops being the tip, these guards
      # keep running, stay green, and read older rules. This step makes that
      # case loud too.
      #
      # THE SCOPE IS DERIVED, NOT KEPT BY HAND. The read set is computed from
      # the `-m nmg2_tools.<module>` entry points and the `--register` path that
      # appear in the steps of THIS file, plus the import closure of those entry
      # points inside the checkout. A hand-kept path list is correct on the day
      # it is written and silently wrong the day a step starts reading something
      # new. Drift elsewhere in the tools repository cannot change a verdict
      # here and is deliberately not reported.
      #
      # A THREE-DOT DIFF asks what a branch INTRODUCED that `lint-current`
      # lacks, and ignores work `lint-current` has that the branch does not. A
      # branch lower in the stack is behind by design, and that is not
      # staleness.
      #
      # THIS IS AN ABSENCE TEST, SO IT CARRIES CONTROLS. Each one turns a
      # scan-that-never-ran into a RED with its own reason, instead of the
      # silent exit 0 that is byte for byte what a fresh alias prints:
      #
      #   1. this workflow file is present, so the read set has a source
      #   2. at least two entry points were derived from it
      #   3. at least one `tools/*` branch was fetched to compare against
      - name: lint-current-is-not-behind
        working-directory: lint-tools
        run: |
          set -euo pipefail

          wf="$GITHUB_WORKSPACE/under-test/.github/workflows/track-repo.yml"

          # CONTROL 1: the read set has a source.
          if [ ! -f "$wf" ]; then
            echo "CONTROL FAILED: $wf is missing, so the read set could not be derived."
            exit 1
          fi

          roots=$(grep -oE -- '-m nmg2_tools\.[a-z_]+' "$wf" | sed 's|^-m ||' | sort -u || true)
          registers=$(grep -oE -- '--register [^ ]+' "$wf" | sed 's|^--register ||' | sort -u || true)
          nroots=$(printf '%s\n' "$roots" | sed '/^$/d' | wc -l | tr -d ' ')

          # CONTROL 2: the derivation found the entry points it was meant to find.
          if [ "$nroots" -lt 2 ]; then
            echo "CONTROL FAILED: derived $nroots lint entry point(s) from $wf; expected at least 2."
            echo "The read set would have been narrower than what this job runs."
            exit 1
          fi

          readset=$(ROOTS="$roots" REGISTERS="$registers" python3 - <<'PY'
          import importlib, os, sys
          sys.path.insert(0, os.getcwd())
          cwd = os.path.realpath(os.getcwd()) + os.sep
          for r in os.environ["ROOTS"].split():
              importlib.import_module(r)
          paths = set()
          for m in list(sys.modules.values()):
              f = getattr(m, "__file__", None)
              if not f:
                  continue
              f = os.path.realpath(f)
              if f.startswith(cwd) and os.path.isfile(f):
                  paths.add(os.path.relpath(f, cwd))
          paths.update(p for p in os.environ.get("REGISTERS", "").split() if os.path.isfile(p))
          print("\n".join(sorted(paths)))
          PY
          )
          echo "Read set derived from $nroots entry point(s) in this job's own steps:"
          echo "$readset" | while IFS= read -r member; do echo "  $member"; done

          if ! git fetch --quiet origin '+refs/heads/tools/*:refs/remotes/stack/*'; then
            echo "FAILED: could not fetch the tools/* branches of axiomantic/nmg2-tools."
            exit 1
          fi
          n=$(git for-each-ref --format='%(refname:short)' refs/remotes/stack | wc -l | tr -d ' ')

          # CONTROL 3: the comparison examined something.
          if [ "$n" -eq 0 ]; then
            echo "CONTROL FAILED: no tools/* branch was fetched, so this step compared"
            echo "lint-current against nothing and proved nothing."
            exit 1
          fi
          echo "lint-current is $(git rev-parse HEAD). Comparing it against $n tools/* branch(es)."

          stale=0
          for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/stack); do
            # $readset is split on purpose: it is a list of pathspecs.
            # shellcheck disable=SC2086
            drift=$(git diff --name-only "HEAD...$b" -- $readset)
            if [ -n "$drift" ]; then
              echo "STALE: lint-current lacks changes carried by $b:"
              echo "$drift" | while IFS= read -r changed; do echo "  $changed"; done
              stale=1
            fi
          done

          if [ "$stale" -ne 0 ]; then
            echo
            echo "The lint-current alias in axiomantic/nmg2-tools is behind the stack, so"
            echo "these guards would have run older rules and reported nothing about it."
            echo "Move that alias to the branch that carries the changes listed above."
            echo "No consuming repository needs an edit."
            exit 1
          fi

          echo "OK: lint-current carries every tools/* change to the files this job reads."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: no-private-submodule
        working-directory: lint-tools
        run: python3 -m nmg2_tools.submodule_lint "${GITHUB_WORKSPACE}/under-test"

      - name: no-clavia-payload
        working-directory: lint-tools
        run: |
          python3 -m nmg2_tools.payload_lint "${GITHUB_WORKSPACE}/under-test" \
            --register nmg2_tools/testdata/register.tsv \
            --visibility "${{ inputs.visibility }}" \
            --repo "${{ github.repository }}"

      # The upload step reads the WHOLE workflow text and NOT an action
      # allow-list. A `run: gh release download` against the private
      # repository, a `curl` against a private release asset and a `git clone`
      # of the private repository are none of `upload-artifact`, `cache` or
      # `download-artifact`, and an action allow-list passes each of them
      # untouched.
      #
      # The patterns below are assembled from split string literals ON PURPOSE.
      # This step scans EVERY workflow file in the repository, including this
      # one. A pattern written as one literal would match its own definition
      # and the step would fail on itself for ever. THE PROBE STRINGS BELOW ARE
      # SPLIT AT DIFFERENT POINTS FROM THE PATTERNS, which is what makes them a
      # control and not a tautology: two independent spellings of one string
      # must still meet.
      #
      # THIS STEP IS AN ABSENCE TEST, SO IT CARRIES CONTROLS. A loop over a glob
      # that expanded to nothing prints nothing and exits 0, which is byte for
      # byte what a clean tree prints. The scan that examined no file and the
      # scan that found no violation were indistinguishable, and this step
      # guards the clean-room payload boundary -- the place where a silent GREEN
      # costs the most. Two controls close it:
      #
      #   1. the scope directory exists
      #   2. the glob matched at least one file, counted and asserted
      #
      # and a third proves the instrument is alive:
      #
      #   3. every pattern still matches its own probe, so a pattern broken by
      #      an edit to its split literal cannot report a clean tree it never
      #      inspected
      #
      # WHAT COUNTS AS A PAYLOAD VIOLATION IS UNCHANGED. The controls fail the
      # step for a different and clearly labelled reason: the scan did not run.
      - name: no-clavia-upload
        env:
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -uo pipefail
          pa="nmg2""-artifacts"
          pb="gold""en/"
          pc="captu""res/"
          pd="corp""us/"
          pe="fixtures/proto""col/"
          pf="[._]dum""p\b"
          patterns="${pa}|${pb}|${pc}|${pd}|${pe}|${pf}"
          fail=0

          # CONTROL 3: THE INSTRUMENT IS ALIVE. Each probe spells the string the
          # pattern is meant to name, split at a different point, so no whole
          # pattern appears as contiguous text in this file and the step still
          # cannot fail on itself.
          probe_a="nm""g2-artifacts"
          probe_b="go""lden/"
          probe_c="cap""tures/"
          probe_d="co""rpus/"
          probe_e="fixtures/pro""tocol/"
          probe_f="x.du""mp "
          for pair in "pa:${probe_a}" "pb:${probe_b}" "pc:${probe_c}" \
                      "pd:${probe_d}" "pe:${probe_e}" "pf:${probe_f}"; do
            name="${pair%%:*}"
            probe="${pair#*:}"
            eval "pat=\${${name}}"
            if ! printf '%s\n' "${probe}" | grep -qE "${pat}"; then
              echo "FAILURE no-clavia-upload: pattern ${name} no longer matches its own probe."
              echo "A pattern that names nothing reports a clean tree it never inspected."
              fail=1
            fi
          done

          # CONTROL 1: THE SCOPE EXISTS. A checkout that did not land, or a
          # repository with no workflow directory, leaves nothing to scan.
          scope="under-test/.github/workflows"
          if [ ! -d "${scope}" ]; then
            echo "FAILURE no-clavia-upload: the scope ${scope} is not a directory."
            echo "Nothing was scanned, so this step proved nothing about the payload boundary."
            fail=1
          fi

          allow=""
          if [ "${VISIBILITY}" = "private" ]; then
            allow="t1-t2.yml"
          fi
          scanned=0
          examined=0
          for f in "${scope}"/*.yml "${scope}"/*.yaml; do
            [ -e "$f" ] || continue
            scanned=$((scanned + 1))
            base=$(basename "$f")
            if [ -n "${allow}" ] && [ "${base}" = "${allow}" ]; then
              echo "allow-listed: ${base}"
              continue
            fi
            examined=$((examined + 1))
            if grep -nEi "${patterns}" "$f"; then
              echo "FAILURE no-clavia-upload: ${f} names the private repository or an artifact-tree path."
              fail=1
            fi
          done

          # CONTROL 2: THE GLOB MATCHED SOMETHING. `scanned` counts files the
          # glob produced, allow-listed ones included, because the question this
          # control answers is whether the loop had any input at all.
          if [ "${scanned}" -eq 0 ]; then
            echo "FAILURE no-clavia-upload: the glob under ${scope} matched no file."
            echo "An empty scan and a clean scan print the same thing; this is the empty one."
            fail=1
          fi
          echo "no-clavia-upload: ${scanned} workflow file(s) matched, ${examined} examined."
          exit "${fail}"

      - name: no-artifact-credential
        working-directory: lint-tools
        run: |
          python3 -m nmg2_tools.credential_lint "${GITHUB_WORKSPACE}/under-test" \
            --visibility "${{ inputs.visibility }}"

      # THE COMMENT-RUBRIC GATE. ONE CLAUSE FAILS THIS JOB; THE REST ARE
      # INFORMATION.
      #
      # A per-clause measurement over every open pull-request head in this
      # project produced 257408 raw matches and 4 adjudicated violations. The
      # scanner exits 1 on ANY match, so a step that took that status as its
      # verdict would fail every build in the project and would say nothing
      # about any of them. This step therefore does NOT read the scanner's
      # status as a verdict. It reads the per-clause breakdown and gates on the
      # `roster` clause alone, which matched nothing anywhere in that
      # measurement: gating it costs nothing today and it is red the moment a
      # roster claim comes back. Every other clause is printed as advisory and
      # cannot turn this job red.
      #
      # THE STATUS IS STILL CHECKED, FOR A DIFFERENT QUESTION. Exit 2 means one
      # of the scanner's own controls failed and the counts it printed are
      # unusable; any status the scanner does not define means it did not run as
      # intended. Both are RED, because a broken scan and a clean scan otherwise
      # print the same verdict, and that is the failure this whole file exists
      # to remove. The counts are believed only after the status clears.
      - name: comment-rubric
        working-directory: lint-tools
        run: |
          set -uo pipefail

          # `|| rc=$?` AND NOT A BARE ASSIGNMENT. This job's steps run under
          # `bash -e`, where a bare `out=$(...)` whose command exits non-zero
          # ends the step then and there, carrying the scanner's own status --
          # so the step would go red on exit 1, which is the very thing it
          # exists not to do, and the case statement below would never run.
          rc=0
          out=$(./scripts/check-comment-rubric.sh "${GITHUB_WORKSPACE}/under-test" 2>&1) || rc=$?
          printf '%s\n' "$out"
          echo
          case "$rc" in
            0|1)
              ;;
            2)
              echo "FAILURE comment-rubric: the scanner's own controls failed (exit 2), so the"
              echo "counts above are unusable. A scan that could not run is not a clean scan."
              exit 1
              ;;
            *)
              echo "FAILURE comment-rubric: the scanner exited ${rc}, a status it does not define."
              echo "It defines 0 (no matches), 1 (matches to adjudicate) and 2 (control failed)."
              exit 1
              ;;
          esac

          # A clause line is a bare name and a number and nothing else. Matched
          # source lines are indented four spaces and every summary line carries
          # a colon, so neither can be read as a count.
          counts=$(printf '%s\n' "$out" | awk '/^[a-z]+[ \t]+[0-9]+$/ { print $1, $2 }')
          parsed=$(printf '%s\n' "$counts" | grep -c . || true)

          # CONTROL 1: THE BREAKDOWN WAS PARSED, AND ALL OF IT WAS. The expected
          # number is taken from the scanner's own controls line rather than
          # kept here, so a clause added there cannot go unread here. If the
          # output format moves, this parse yields nothing -- which reads
          # exactly like a clean tree -- so it is checked before it is trusted.
          expected=$(printf '%s\n' "$out" | sed -n 's/^controls: all \([0-9][0-9]*\) clause patterns fire.*/\1/p')
          if [ -z "${expected}" ]; then
            echo "CONTROL FAILED comment-rubric: the scanner printed no controls line, so how"
            echo "many clauses it ran is unknown and the breakdown cannot be checked."
            exit 1
          fi
          if [ "${parsed}" -ne "${expected}" ]; then
            echo "CONTROL FAILED comment-rubric: parsed ${parsed} clause count(s) from output that"
            echo "reports ${expected} clause(s). The gate would have judged a breakdown it never read."
            exit 1
          fi

          # CONTROL 2: THE GATED CLAUSE IS ONE OF THE CLAUSES THAT WAS PARSED. A
          # renamed clause would otherwise leave this step green for ever while
          # gating nothing at all.
          roster=$(printf '%s\n' "$counts" | awk '$1 == "roster" { print $2 }')
          if [ -z "${roster}" ]; then
            echo "CONTROL FAILED comment-rubric: no 'roster' count in the breakdown, so the one"
            echo "clause this step gates was never measured."
            exit 1
          fi

          # CONTROL 3: THE SCAN HAD A POPULATION. A checkout that did not happen,
          # a path that does not exist and a tree the scanner cannot descend all
          # produce zero matches in every clause, which is byte for byte what a
          # clean tree produces. This turns that case red instead. Found while
          # testing this step: a `under-test` that was a symlink scanned nothing
          # and reported every clause at zero.
          population=$(printf '%s\n' "$out" | sed -n 's/^population: \([0-9][0-9]*\) files .*/\1/p')
          if [ -z "${population}" ]; then
            echo "CONTROL FAILED comment-rubric: the scanner printed no population line, so what"
            echo "it scanned is unknown and zero matches cannot be told from an empty scan."
            exit 1
          fi
          if [ "${population}" -eq 0 ]; then
            echo "CONTROL FAILED comment-rubric: the scanner found 0 files under"
            echo "${GITHUB_WORKSPACE}/under-test, so it scanned nothing. An empty scan and a"
            echo "clean scan print the same breakdown; this is the empty one."
            exit 1
          fi
          echo "population: ${population} file(s) scanned under ${GITHUB_WORKSPACE}/under-test"
          echo "ADVISORY -- raw matches, not violations, and not a verdict. These cannot"
          echo "fail this job. Read them; do not act on the number alone."
          printf '%s\n' "$counts" | awk '$1 != "roster" { printf "  %-10s %s raw match(es)\n", $1, $2 }'
          echo "GATED -- this clause fails the job:"
          printf '  %-10s %s raw match(es)\n' roster "${roster}"

          if [ "${roster}" -ne 0 ]; then
            echo
            echo "FAILURE comment-rubric: the 'roster' clause matched ${roster} line(s)."
            echo "That clause matched nothing anywhere in this project on the day it was"
            echo "gated, so every line it reports here is new. The matched lines are printed"
            echo "under 'roster' in the scanner output above."
            exit 1
          fi

          echo
          echo "OK: the gated 'roster' clause matched nothing."
