# The lint-only caller.
#
# This repository holds NO source of this project's own, so it runs no T0 suite
# and it gets a lint-only caller rather than a `ci.yml`. It carries no build
# matrix, no T0 context and no required check. It keeps whatever upstream
# already configures.
#
# The `push` trigger is scoped to the default branch, so a branch and its pull
# request are judged once, by the `pull_request` event. That event checks out
# the MERGE result; a `push` event checks out the head as it stands, and
# `actions/checkout` takes no `ref:` here, so the event alone decides which
# tree is judged.
#
# The cost is not hidden: a branch with no pull request open is no longer
# covered. That coverage is what the unscoped `push` trigger bought, and it is
# deliberately given up. Judging the head of a pull-request branch reports
# failures for conditions the merge destroys. Measured 2026-09-04 --
# two pull requests elsewhere in this queue were red only in the `push`
# context, with 24 findings against the head tree and 0 against the merge
# tree. They are named in the plan record, not here: this file is public and
# the `no-clavia-upload` guard rejects a workflow that names the private
# repository. That guard caught this comment on the commit that installed it.

name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lints:
    uses: ./.github/workflows/track-repo.yml
    with:
      visibility: public
